services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: control_plane_backend
    ports:
      - "5001:5001"
    env_file:
      - path: .env.local
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=development
      - TARGET_REPOSITORY=${TARGET_REPOSITORY:-utamhank1/superset_exploration}
      - APP_ENV=${APP_ENV:-demo}
    volumes:
      - ./backend:/app

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: control_plane_dashboard
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:5001
    depends_on:
      - backend

  ngrok:
    image: ngrok/ngrok:latest
    container_name: control_plane_ngrok
    profiles:
      - webhook
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http backend:5001
    ports:
      - "4040:4040"
    depends_on:
      - backend
